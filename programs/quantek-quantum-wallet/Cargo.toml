[package]
name = "quantek-quantum-wallet"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "QUANTEK Solana WOTS-16 quantum-wallet verifier and custody program."

[lib]
crate-type = ["cdylib", "lib"]
name = "quantek_quantum_wallet"

[features]
default = []
no-entrypoint = []

[dependencies]
borsh = { version = "1.5", features = ["derive"] }
solana-program = "2.3"
